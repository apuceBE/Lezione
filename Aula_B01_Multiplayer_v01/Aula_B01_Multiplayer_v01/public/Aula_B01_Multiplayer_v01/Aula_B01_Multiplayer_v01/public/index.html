<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aula B01 · Multiplayer Quest 3</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><style>body{margin:0;font:14px system-ui}#ui{position:fixed;top:12px;left:12px;z-index:10;width:min(350px,calc(100vw - 40px));background:#10233af2;color:#fff;padding:16px;border-radius:16px;box-shadow:0 8px 30px #0005}h2{font-size:17px;margin:0 0 8px}p{margin:8px 0}input{padding:11px;border-radius:8px;border:1px solid #8ca4bd;background:#f8fbff;width:calc(100% - 24px);margin:4px 0;color:#10233a}button{padding:10px 12px;border:0;border-radius:9px;background:#7dd7ff;color:#10233a;font-weight:700;margin:4px 3px 4px 0}button:disabled{opacity:.4}#controls{display:none}#status{font-size:12px;color:#c8e5f7}small{color:#c9dbe8}#counter{font-weight:bold}</style></head><body><div id="ui"><h2>🎓 Aula immersiva · B01</h2><div id="login"><p>Entra nella stessa aula con altri docenti (max 20).</p><input id="name" placeholder="Il tuo nome" maxlength="28"><input id="code" placeholder="Codice aula (es. CORSO3)" value="CORSO3" maxlength="12"><button id="join">Entra nell'aula</button></div><div id="controls"><p><span id="counter">1/20</span> · <span id="role"></span> · Aula <b id="roomcode"></b></p><p id="slideName"></p><button id="prev">◀ Precedente</button><button id="next">Successivo ▶</button><button id="play">▶ Avvia voce</button><button id="stop">■ Ferma</button><p><small>In VR: usa il puntatore centrale e i controlli del visore. Muoviti con il controller. La voce italiana dipende dal browser.</small></p></div><p id="status">Pronto. Per entrare in VR è necessario HTTPS e un browser compatibile WebXR.</p></div>
<a-scene background="color:#101f36" renderer="colorManagement:true;antialias:true" xr-mode-ui="enabled:true"><a-entity light="type:ambient;intensity:0.8"></a-entity><a-entity light="type:directional;intensity:1" position="-2 5 2"></a-entity><a-plane rotation="-90 0 0" width="14" height="14" color="#b4c6d5"></a-plane><a-plane position="0 3 -5" width="14" height="6" color="#eaf0f7"></a-plane><a-box position="0 2.2 -4.86" width="5.4" height="2.7" depth="0.12" color="#123459"></a-box><a-text id="board" value="B01 - AULA MULTIPLAYER" align="center" color="#fff" width="4.7" position="0 2.45 -4.76"></a-text><a-text id="participants" value="PARTECIPANTI: 0" align="center" color="#26455e" width="3.2" position="4.0 2.9 -4.76"></a-text>
<a-entity id="teacher" position="0 0 -2.9"><a-cylinder position="0 0.94 0" radius="0.24" height="0.9" color="#28548d"></a-cylinder><a-cylinder position="-.13 .35 0" radius=".105" height=".7" color="#263950"></a-cylinder><a-cylinder position=".13 .35 0" radius=".105" height=".7" color="#263950"></a-cylinder><a-cylinder position="-.35 1.02 0" radius=".09" height=".75" rotation="0 0 12" color="#28548d"></a-cylinder><a-cylinder position=".35 1.02 0" radius=".09" height=".75" rotation="0 0 -12" color="#28548d"></a-cylinder><a-sphere position="0 1.65 0" radius=".28" scale="1 1.13 .9" color="#d8a383"></a-sphere><a-sphere position="0 1.85 -.05" radius=".27" scale="1 .45 .9" color="#33303b"></a-sphere><a-box id="mouth" position="0 1.5 .25" width=".12" height=".02" depth=".01" color="#723c42"></a-box></a-entity><a-text value="DOCENTE VIRTUALE" align="center" color="#29405e" width="2.4" position="0 2.2 -2.9"></a-text><a-entity id="others"></a-entity><a-entity id="rig" position="0 0 2.5"><a-entity id="camera" camera look-controls wasd-controls position="0 1.65 0"><a-cursor color="#00b6ff" raycaster="objects: .clickable"></a-cursor></a-entity></a-entity></a-scene>
<script>
const $=id=>document.getElementById(id),slides=[{title:'B01 – Dall’esperienza immersiva alla lezione disciplinare',board:'B01 · LEZIONE DISCIPLINARE\n\nOBIETTIVO → ESPERIENZA → STRUMENTO',speech:'Benvenuti nella Lezione tre. Oggi vedremo come trasformare una esperienza immersiva in una attività didattica. Il punto di partenza non è il visore, ma ciò che lo studente deve imparare.'},{title:'Partire dall’obiettivo',board:'PRIMA L’OBIETTIVO\n\nQuale apprendimento vogliamo osservare?',speech:'Meta Quest tre non è una metodologia didattica. Definiamo prima un obiettivo osservabile, poi individuiamo il valore aggiunto della realtà virtuale e infine scegliamo lo strumento.'},{title:'Esempio: Scienze',board:'SCIENZE · ANATOMIA DEL CUORE\n\nOSSERVARE · RICONOSCERE · SPIEGARE',speech:'In scienze, non basta esplorare un modello tridimensionale del cuore. La missione dello studente è riconoscere le strutture principali e spiegare la relazione tra forma e funzione.'}];
let ws=null,myId=null,hostId=null,slide=0,timer=null,voiceTimer=null,peers=new Map(),lastPose=0;
function status(t){$('status').textContent=t}function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function avatar(p){if(p.id===myId)return;let e=peers.get(p.id);if(!e){e=document.createElement('a-entity');e.innerHTML=`<a-cylinder position="0 .85 0" radius=".23" height=".95" color="#39a6b1"></a-cylinder><a-sphere position="0 1.57 0" radius=".25" color="#e3b293"></a-sphere><a-cylinder position="-.12 .28 0" radius=".1" height=".56" color="#425579"></a-cylinder><a-cylinder position=".12 .28 0" radius=".1" height=".56" color="#425579"></a-cylinder><a-text align="center" position="0 2.05 0" width="2.3" color="#183b5d" value="${p.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></a-text>`;$('others').appendChild(e);peers.set(p.id,e)}e.setAttribute('position',`${p.x} 0 ${p.z}`);e.setAttribute('rotation',`0 ${p.rot||0} 0`)}
function render(){ $('board').setAttribute('value',slides[slide].board);$('slideName').textContent=slides[slide].title;$('counter').textContent=`${peers.size+1}/20`;$('participants').setAttribute('value',`PARTECIPANTI: ${peers.size+1}`);const host=myId===hostId;$('role').textContent=host?'Regista (prima persona entrata)':'Partecipante';for(const b of ['prev','next','play','stop'])$(b).disabled=!host}
function stopSpeech(){if('speechSynthesis'in window)speechSynthesis.cancel();clearInterval(voiceTimer);clearTimeout(timer);$('mouth').setAttribute('height','.02')}
function speak(){stopSpeech();if(!('speechSynthesis'in window)){status('Il browser non supporta la sintesi vocale italiana.');return}const u=new SpeechSynthesisUtterance(slides[slide].speech);u.lang='it-IT';u.rate=.9;const it=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('it'));if(it)u.voice=it;u.onstart=()=>{status('Spiegazione in corso…');voiceTimer=setInterval(()=>$('mouth').setAttribute('height',String(.02+Math.random()*.07)),130)};u.onend=()=>{clearInterval(voiceTimer);$('mouth').setAttribute('height','.02');status('Spiegazione terminata.')};u.onerror=()=>{clearInterval(voiceTimer);status('Sintesi vocale non disponibile su questo dispositivo.')};speechSynthesis.speak(u)}
function lesson(m){slide=m.slide;render();stopSpeech();if(m.playing){const wait=Math.max(0,m.startedAt-Date.now());timer=setTimeout(speak,wait)}else status('Contenuto aggiornato dal regista.')}
$('join').onclick=()=>{if(ws)return;const name=$('name').value.trim()||'Docente',code=$('code').value.trim().toUpperCase();if(!/^[A-Z0-9]{4,12}$/.test(code)){status('Inserisci un codice di 4-12 lettere o numeri.');return}const url=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';ws=new WebSocket(url);ws.onopen=()=>send({type:'join',name,code});ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='error'){status(m.message);ws.close();ws=null}if(m.type==='welcome'){myId=m.id;$('login').style.display='none';$('controls').style.display='block';$('roomcode').textContent=m.code;status('Connesso. Premi Entra in VR per la modalità immersiva.')}if(m.type==='state'){hostId=m.hostId;slide=m.slide;const ids=new Set(m.peers.filter(p=>p.id!==myId).map(p=>p.id));for(const [id,el]of peers)if(!ids.has(id)){el.remove();peers.delete(id)}m.peers.forEach(avatar);render();if(m.playing)lesson(m)}if(m.type==='joined'){avatar(m.peer);render()}if(m.type==='left'){peers.get(m.id)?.remove();peers.delete(m.id);hostId=m.hostId;render()}if(m.type==='pose'){const el=peers.get(m.id);if(el){el.setAttribute('position',`${m.x} 0 ${m.z}`);el.setAttribute('rotation',`0 ${m.rot} 0`)}}if(m.type==='lesson')lesson(m)};ws.onerror=()=>status('Connessione non riuscita. Verifica che il server multiplayer sia attivo.');ws.onclose=()=>{status('Connessione chiusa. Ricarica per rientrare.');ws=null}};
$('next').onclick=()=>send({type:'slide',index:(slide+1)%slides.length});$('prev').onclick=()=>send({type:'slide',index:(slide+slides.length-1)%slides.length});$('play').onclick=()=>send({type:'play',playing:true});$('stop').onclick=()=>send({type:'play',playing:false});
setInterval(()=>{if(!myId||!ws||ws.readyState!==1)return;const rig=$('rig').object3D,camera=$('camera').object3D;const pos=new THREE.Vector3();camera.getWorldPosition(pos);const rot=new THREE.Euler().setFromQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()),'YXZ');send({type:'pose',x:pos.x,z:pos.z,rot:THREE.MathUtils.radToDeg(rot.y)})},250);
</script></body></html>
